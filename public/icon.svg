<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient for richness -->
    <radialGradient id="greenBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#006c35" />
      <stop offset="70%" stop-color="#005a2b" />
      <stop offset="100%" stop-color="#004d24" />
    </radialGradient>

    <!-- Five-pointed star template -->
    <g id="star">
      <polygon points="0,-14 4.3,-4.3 14.7,-4.3 6.3,1.8 9.5,12 0,5.8 -9.5,12 -6.3,1.8 -14.7,-4.3 -4.3,-4.3" fill="#ffffff" />
    </g>
    <g id="star-lg">
      <polygon points="0,-22 6.8,-6.8 23.1,-6.8 9.9,2.8 14.9,18.8 0,9.1 -14.9,18.8 -9.9,2.8 -23.1,-6.8 -6.8,-6.8" fill="#ffffff" />
    </g>

    <!-- Path for curved lower outer text -->
    <!-- Centered at (256, 256), radius ~215 -->
    <path id="bottomTextPath" d="M 70 310 A 215 215 0 0 0 442 310" />
  </defs>

  <!-- Outer background circle -->
  <circle cx="256" cy="256" r="250" fill="#ffffff" />
  
  <!-- Outer Green Decorative Ring with Top Arc & Terminal Nodes -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#005a2b" stroke-width="16" />
  <circle cx="44" cy="256" r="14" fill="#005a2b" />
  <circle cx="468" cy="256" r="14" fill="#005a2b" />

  <!-- Inner Solid Green Circle -->
  <circle cx="256" cy="256" r="195" fill="url(#greenBg)" />

  <!-- 9 White Stars in Upper Arc -->
  <!-- Top Center Big Star -->
  <use href="#star-lg" x="256" y="112" />
  <!-- 4 Stars Left -->
  <use href="#star" x="214" y="126" />
  <use href="#star" x="176" y="148" />
  <use href="#star" x="146" y="180" />
  <use href="#star" x="126" y="222" />
  <!-- 4 Stars Right -->
  <use href="#star" x="298" y="126" />
  <use href="#star" x="336" y="148" />
  <use href="#star" x="366" y="180" />
  <use href="#star" x="386" y="222" />

  <!-- Open Quran Book (Kitab Terbuka) in Dynamic Stylized Lines -->
  <g stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left Page Outer & Upper Fold -->
    <path d="M 250 216 L 195 185 L 148 245 L 210 262 L 246 295 L 200 290 L 140 270 L 160 218" />
    <path d="M 195 185 L 250 205 L 246 270 L 160 248 Z" fill="#005a2b" />
    
    <!-- Right Page Outer & Upper Fold -->
    <path d="M 262 216 L 317 185 L 364 245 L 302 262 L 266 295 L 312 290 L 372 270 L 352 218" />
    <path d="M 317 185 L 262 205 L 266 270 L 352 248 Z" fill="#005a2b" />

    <!-- Solid White Book Pages Folds -->
    <polygon points="195,185 248,206 172,246 148,245" fill="#ffffff" stroke="none" />
    <polygon points="317,185 264,206 340,246 364,245" fill="#ffffff" stroke="none" />
    
    <!-- Lower Leaf Folds -->
    <polygon points="175,248 248,272 216,285 146,268" fill="#ffffff" stroke="none" />
    <polygon points="337,248 264,272 296,285 366,268" fill="#ffffff" stroke="none" />
    <polygon points="216,286 248,295 180,296 142,274" fill="#ffffff" stroke="none" />
    <polygon points="296,286 264,295 332,296 370,274" fill="#ffffff" stroke="none" />
  </g>

  <!-- Central Quill Feather Pen (Pena Bulu) -->
  <g transform="translate(256, 210) rotate(14)">
    <!-- Feather Body -->
    <path d="M 0 50 C -4 30 -22 10 -22 -15 C -22 -45 0 -85 0 -85 C 0 -85 22 -45 22 -15 C 22 10 4 30 0 50 Z" fill="#ffffff" />
    <!-- Feather Center Quill Shaft -->
    <path d="M 0 -85 L 0 55" stroke="#005a2b" stroke-width="3.5" stroke-linecap="round" />
    <!-- Feather Vane Cuts -->
    <path d="M 0 -45 L -16 -35 M 0 -25 L -18 -15 M 0 -5 L -16 5 M 0 15 L -12 25" stroke="#005a2b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 0 -40 L 16 -30 M 0 -20 L 18 -10 M 0 0 L 16 10 M 0 20 L 12 30" stroke="#005a2b" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Lower Curved Horizon Separator Line -->
  <path d="M 120 348 Q 256 312 392 348" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />

  <!-- Lower Information Section: Applikasi MULTI INFORMASI KENDAL -->
  <!-- Wifi Signal Arcs above "pp" -->
  <g stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="256" cy="336" r="2.5" fill="#ffffff" stroke="none" />
    <path d="M 250 330 A 7 7 0 0 1 262 330" />
    <path d="M 245 324 A 13 13 0 0 1 267 324" />
  </g>

  <!-- Applikasi -->
  <text x="256" y="374" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Applikasi</text>
  
  <!-- MULTI INFORMASI -->
  <text x="256" y="392" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2.5">MULTI INFORMASI</text>
  
  <!-- KENDAL -->
  <text x="256" y="416" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">KENDAL</text>

  <!-- Curved Outer Lower Text: MDT ULA NU 09 BAHRUL ULUM -->
  <text fill="#005a2b" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="29.5" font-weight="900" letter-spacing="3.5">
    <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">
      MDT ULA NU 09 BAHRUL ULUM
    </textPath>
  </text>
</svg>
