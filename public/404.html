<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <title>MadrasahKu Digital</title>
    <script>
      // Single Page Apps for GitHub Pages / Cloud Run static fallback
      // Redirect 404 paths to hash route on root
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        var newUrl = '/' + (hash ? hash : ('#' + path + search));
        window.location.replace(newUrl);
      })();
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding: 40px; color: #333;">
    <p>Memuat aplikasi MadrasahKu...</p>
  </body>
</html>
